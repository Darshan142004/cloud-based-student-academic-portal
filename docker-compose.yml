
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-portal-app:latest
    container_name: student-portal-app
    ports:
      - "8080:80"
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./certs:/var/www/html/certs:ro
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-${DB_PASSWORD}}
      DB_NAME: ${DB_NAME:-student_portal}
      DB_SSL_MODE: ${DB_SSL_MODE:-disabled}
      DB_SSL_CA: ${DB_SSL_CA:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-}
      APPINSIGHTS_CONNECTION_STRING: ${APPINSIGHTS_CONNECTION_STRING:-}
      APP_TELEMETRY_LOG: ${APP_TELEMETRY_LOG:-}
    depends_on:
      mysql:
        condition: service_healthy
        required: false

  mysql:
    image: mysql:8.0
    container_name: student-portal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: student_portal
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/student_portal.sql:/docker-entrypoint-initdb.d/student_portal.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      timeout: 5s
      retries: 10
      interval: 5s
      start_period: 30s

volumes:
  mysql_data:
