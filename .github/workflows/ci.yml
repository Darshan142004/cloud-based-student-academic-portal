name: EduPulse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-security:
    name: PHP, JavaScript and Secret Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP syntax check
        run: |
          find . -name "*.php" -not -path "./.git/*" \
            -print0 | xargs -0 -r -n1 php -l

      - name: JavaScript syntax check
        run: |
          find . -name "*.js" -not -path "./.git/*" \
            -print0 | xargs -0 -r -n1 node --check

      - name: Check for hardcoded Azure secrets
        run: |
          if grep -rnE \
            "AccountKey=[A-Za-z0-9+/=]{20,}|InstrumentationKey=[0-9a-fA-F-]{36}" \
            --exclude-dir=.git --exclude="*.md" --exclude="*.example" .; then
            echo "Potential hardcoded Azure secret detected."
            exit 1
          fi

  docker-integration-test:
    name: Docker and MySQL Integration Tests
    needs: lint-and-security
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ci_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start application
        run: docker compose up -d --build

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 60); do
            if docker exec student-portal-mysql \
              mysqladmin ping -h localhost -uroot \
              -p"$DB_PASSWORD" --silent; then
              echo "MySQL is ready."
              exit 0
            fi
            sleep 2
          done

          docker compose logs mysql
          exit 1

      - name: Verify database schema
        run: |
          docker exec student-portal-mysql \
            mysql -uroot -p"$DB_PASSWORD" \
            -e "USE student_portal; SHOW TABLES;"

      - name: Apply database migrations
        run: |
          for f in database/migrations/*.sql; do
            [ -f "$f" ] || continue
            echo "Applying $f"
            docker exec -i student-portal-mysql \
              mysql -uroot -p"$DB_PASSWORD" student_portal < "$f"
          done

      - name: Verify application health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/; then
              break
            fi
            sleep 2
          done

          curl --fail --silent --show-error \
            http://localhost:8080/backend/api/health.php \
            | tee /tmp/health.json

          grep -q '"status":"healthy"' /tmp/health.json

      - name: Verify RBAC protection
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8080/backend/api/get_performance_analytics.php)" = "401"

          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8080/backend/api/get_documents.php)" = "401"

          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8080/backend/api/admin/manage_assignments.php)" = "401"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down
