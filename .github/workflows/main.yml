
name: EduPulse CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-security:
    name: Static Lint and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check PHP syntax
        run: |
          find . -name "*.php" -not -path "./.git/*" -print0 |
          xargs -0 -r -n1 php -l

      - name: Check JavaScript syntax
        run: |
          find . -name "*.js" -not -path "./.git/*" -print0 |
          xargs -0 -r -n1 node --check

      - name: Scan for exposed Azure secrets
        run: |
          if grep -rnE \
            "AccountKey=[A-Za-z0-9+/=]{20,}|InstrumentationKey=[0-9a-fA-F-]{36}" \
            --exclude-dir=.git \
            --exclude="*.md" \
            --exclude="*.example" .; then
            echo "Potential hardcoded Azure secret detected."
            exit 1
          fi

  docker-integration-test:
    name: Docker Build and Integration Tests
    needs: lint-and-security
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ci_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start Docker services
        run: docker compose up -d --build

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 40); do
            if docker exec student-portal-mysql \
              mysqladmin ping -h 127.0.0.1 \
              -uroot -p"$DB_PASSWORD" --silent; then
              echo "MySQL is ready."
              break
            fi
            if [ "$i" -eq 40 ]; then
              docker compose logs mysql
              exit 1
            fi
            sleep 3
          done

      - name: Verify database and tables
        run: |
          docker exec student-portal-mysql \
            mysql -h 127.0.0.1 -uroot -p"$DB_PASSWORD" \
            -e "USE student_portal; SHOW TABLES;"

      - name: Apply database migrations
        run: |
          for f in database/migrations/*.sql; do
            [ -f "$f" ] || continue
            echo "Applying $f"
            docker exec -i student-portal-mysql \
              mysql -h 127.0.0.1 -uroot -p"$DB_PASSWORD" \
              student_portal < "$f"
          done

      - name: Verify application health
        run: |
          for i in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/backend/api/health.php \
              -o /tmp/health.json; then
              cat /tmp/health.json
              grep -q '"status":"healthy"' /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Verify RBAC protection
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8080/backend/api/get_performance_analytics.php)" = "401"

          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8080/backend/api/get_documents.php)" = "401"

          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8080/backend/api/admin/manage_assignments.php)" = "401"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup containers
        if: always()
        run: docker compose down

  deploy-azure:
    name: Build, Push and Deploy to Azure
    needs: [lint-and-security, docker-integration-test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
      AZURE_IMAGE_NAME: ${{ vars.AZURE_IMAGE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Login to Azure using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push Docker image to ACR
        run: |
          IMAGE="$AZURE_ACR_LOGIN_SERVER/$AZURE_IMAGE_NAME:$GITHUB_SHA"

          az acr login --name "$AZURE_ACR_NAME"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy image to Azure Container Apps
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE"

          echo "EduPulse deployment command completed."
